# Python baseline. Copy to .pre-commit-config.yaml, trim, then run `pre-commit autoupdate`.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
exclude: ^(\.venv/|build/|dist/|.*\.lock$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen # runs at commit-msg (set by the hook itself)

  # Needs the project environment, so it runs via uv instead of an isolated hook env.
  # Delete if the test suite is slow; CI covers it.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q -x
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
